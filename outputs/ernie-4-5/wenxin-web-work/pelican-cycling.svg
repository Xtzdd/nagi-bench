<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="Georgia, serif">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb080"/>
      <stop offset="40%" stop-color="#ffd090"/>
      <stop offset="75%" stop-color="#ffe7b8"/>
      <stop offset="100%" stop-color="#f8ead0"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff3c0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffd060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffb060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fffae0"/>
      <stop offset="100%" stop-color="#ffc850"/>
    </radialGradient>
    <!-- Sea gradient -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a070"/>
      <stop offset="20%" stop-color="#d07868"/>
      <stop offset="55%" stop-color="#605880"/>
      <stop offset="100%" stop-color="#20304f"/>
    </linearGradient>
    <!-- Sand gradient -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0cf90"/>
      <stop offset="100%" stop-color="#c89858"/>
    </linearGradient>
    <!-- Pelican body white -->
    <radialGradient id="belly" cx="0.3" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0ebe0"/>
      <stop offset="100%" stop-color="#b8b0a0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#808890"/>
      <stop offset="60%" stop-color="#505860"/>
      <stop offset="100%" stop-color="#2a2e36"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc050"/>
      <stop offset="70%" stop-color="#ff8030"/>
      <stop offset="100%" stop-color="#d04818"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb058"/>
      <stop offset="100%" stop-color="#e06020"/>
    </linearGradient>
    <!-- Bike metal -->
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e83535"/>
      <stop offset="50%" stop-color="#c01f1f"/>
      <stop offset="100%" stop-color="#7a1010"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b8bec4"/>
      <stop offset="100%" stop-color="#585e68"/>
    </linearGradient>
    <radialGradient id="tire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="75%" stop-color="#202020"/>
      <stop offset="82%" stop-color="#d8d8d8"/>
      <stop offset="85%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <!-- Cloud -->
    <radialGradient id="cloud" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe0c0" stop-opacity="0.6"/>
    </radialGradient>
    <!-- filter soft shadow -->
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <!-- sparkle star -->
    <g id="spark">
      <path d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5 Z" fill="#fff0a0"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="900" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="220" r="160" fill="url(#sunGlow)" filter="url(#blur1)"/>
  <circle cx="680" cy="220" r="52" fill="url(#sun)"/>

  <!-- Distant clouds -->
  <g opacity="0.75" fill="url(#cloud)" filter="url(#blur2)">
    <ellipse cx="150" cy="130" rx="80" ry="18"/>
    <ellipse cx="200" cy="115" rx="60" ry="20"/>
    <ellipse cx="100" cy="140" rx="50" ry="14"/>
    <ellipse cx="500" cy="90" rx="70" ry="15"/>
    <ellipse cx="540" cy="100" rx="45" ry="14"/>
    <ellipse cx="820" cy="150" rx="60" ry="16"/>
  </g>

  <!-- Distant sea birds -->
  <g stroke="#3a2a30" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M280,170 q6,-6 12,0 q6,-6 12,0"/>
    <path d="M340,150 q5,-5 10,0 q5,-5 10,0"/>
    <path d="M400,180 q4,-4 8,0 q4,-4 8,0"/>
    <path d="M230,195 q3,-3 6,0 q3,-3 6,0"/>
  </g>

  <!-- Far island silhouette -->
  <path d="M0,340 Q80,320 160,332 Q250,318 340,335 Q420,325 520,338 Q620,330 720,336 Q800,328 900,340 L900,360 L0,360 Z" fill="#6a4a5a" opacity="0.45"/>

  <!-- Sea -->
  <rect y="340" width="900" height="260" fill="url(#sea)"/>

  <!-- Sun reflection on water -->
  <g opacity="0.85">
    <ellipse cx="680" cy="360" rx="70" ry="6" fill="#ffd880" opacity="0.7" filter="url(#blur2)"/>
    <rect x="660" y="365" width="40" height="2" fill="#ffd070"/>
    <rect x="640" y="378" width="80" height="1.5" fill="#ffc060" opacity="0.7"/>
    <rect x="655" y="395" width="50" height="1.3" fill="#ffa050" opacity="0.6"/>
    <rect x="630" y="415" width="100" height="1.2" fill="#ff8850" opacity="0.4"/>
    <rect x="650" y="440" width="60" height="1" fill="#e08070" opacity="0.35"/>
    <rect x="640" y="470" width="80" height="1" fill="#b07890" opacity="0.3"/>
    <rect x="660" y="500" width="40" height="1" fill="#8080a0" opacity="0.3"/>
  </g>

  <!-- Water ripples -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M80,395 q20,-3 40,0"/>
    <path d="M220,420 q30,-3 60,0"/>
    <path d="M420,445 q25,-3 50,0"/>
    <path d="M150,475 q20,-2 40,0"/>
    <path d="M300,500 q30,-3 60,0"/>
    <path d="M500,410 q20,-2 40,0"/>
    <path d="M780,460 q20,-2 40,0"/>
    <path d="M60,510 q15,-2 30,0"/>
    <path d="M400,530 q25,-2 50,0"/>
    <path d="M800,540 q20,-2 40,0"/>
  </g>

  <!-- Sandy beach foreground -->
  <path d="M0,520 Q200,500 450,510 Q700,520 900,505 L900,600 L0,600 Z" fill="url(#sand)"/>
  <!-- sand texture dots -->
  <g fill="#a07838" opacity="0.4">
    <circle cx="80" cy="560" r="1.2"/><circle cx="140" cy="550" r="1"/><circle cx="220" cy="570" r="1.1"/>
    <circle cx="330" cy="555" r="1"/><circle cx="410" cy="575" r="1.2"/><circle cx="520" cy="560" r="1"/>
    <circle cx="620" cy="578" r="1.1"/><circle cx="730" cy="558" r="1"/><circle cx="830" cy="565" r="1.2"/>
    <circle cx="170" cy="580" r="1"/><circle cx="470" cy="585" r="1"/><circle cx="780" cy="588" r="1"/>
  </g>

  <!-- Small pebbles -->
  <ellipse cx="120" cy="575" rx="8" ry="3" fill="#806a58"/>
  <ellipse cx="560" cy="570" rx="6" ry="2.5" fill="#6a5a4a"/>
  <ellipse cx="790" cy="555" rx="5" ry="2" fill="#8a6a50"/>

  <!-- ============ BICYCLE ============ -->
  <g transform="translate(380,430)">
    <!-- rear wheel -->
    <circle cx="-110" cy="70" r="55" fill="url(#tire)"/>
    <circle cx="-110" cy="70" r="55" fill="none" stroke="#101010" stroke-width="3"/>
    <!-- spokes rear -->
    <g stroke="#b8bec4" stroke-width="1.2" opacity="0.9">
      <line x1="-110" y1="70" x2="-110" y2="15"/>
      <line x1="-110" y1="70" x2="-110" y2="125"/>
      <line x1="-110" y1="70" x2="-165" y2="70"/>
      <line x1="-110" y1="70" x2="-55" y2="70"/>
      <line x1="-110" y1="70" x2="-150" y2="31"/>
      <line x1="-110" y1="70" x2="-70" y2="31"/>
      <line x1="-110" y1="70" x2="-150" y2="109"/>
      <line x1="-110" y1="70" x2="-70" y2="109"/>
    </g>
    <circle cx="-110" cy="70" r="7" fill="url(#chrome)"/>

    <!-- front wheel -->
    <circle cx="90" cy="70" r="55" fill="url(#tire)"/>
    <circle cx="90" cy="70" r="55" fill="none" stroke="#101010" stroke-width="3"/>
    <g stroke="#b8bec4" stroke-width="1.2" opacity="0.9">
      <line x1="90" y1="70" x2="90" y2="15"/>
      <line x1="90" y1="70" x2="90" y2="125"/>
      <line x1="90" y1="70" x2="35" y2="70"/>
      <line x1="90" y1="70" x2="145" y2="70"/>
      <line x1="90" y1="70" x2="50" y2="31"/>
      <line x1="90" y1="70" x2="130" y2="31"/>
      <line x1="90" y1="70" x2="50" y2="109"/>
      <line x1="90" y1="70" x2="130" y2="109"/>
    </g>
    <circle cx="90" cy="70" r="7" fill="url(#chrome)"/>

    <!-- frame - step-through cruiser style (for the pelican) -->
    <g fill="none" stroke="url(#frame)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <!-- down tube -->
      <path d="M-30,0 L-110,70"/>
      <!-- top tube / seat tube rise -->
      <path d="M-30,0 L-80,70"/>
      <!-- chain stay -->
      <path d="M-80,70 L-110,70"/>
      <!-- seat stay -->
      <path d="M-80,70 L-110,15"/>
      <!-- head tube rise -->
      <path d="M40,0 L90,70"/>
      <!-- bottom tube to crank -->
      <path d="M-80,70 L40,0"/>
      <!-- top tube connecting seat to head -->
      <path d="M-30,0 L40,0"/>
    </g>

    <!-- seat (big cushy) -->
    <ellipse cx="-30" cy="-8" rx="22" ry="8" fill="#3a1f1a"/>
    <ellipse cx="-30" cy="-10" rx="22" ry="6" fill="#5a2d25"/>
    <rect x="-32" y="-8" width="4" height="10" fill="#202020"/>

    <!-- handlebar stem & bars -->
    <line x1="40" y1="0" x2="45" y2="-28" stroke="#b8bec4" stroke-width="5" stroke-linecap="round"/>
    <path d="M25,-32 Q45,-42 65,-30" stroke="url(#chrome)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- grips -->
    <rect x="22" y="-36" width="8" height="10" rx="3" fill="#2a1810"/>
    <rect x="62" y="-34" width="8" height="10" rx="3" fill="#2a1810"/>

    <!-- fork -->
    <line x1="40" y1="0" x2="90" y2="70" stroke="#b8bec4" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

    <!-- crank + pedals -->
    <circle cx="-80" cy="70" r="10" fill="url(#chrome)" stroke="#606870" stroke-width="2"/>
    <g stroke="#606870" stroke-width="3" stroke-linecap="round">
      <line x1="-80" y1="70" x2="-95" y2="88"/>
      <line x1="-80" y1="70" x2="-65" y2="52"/>
    </g>
    <rect x="-102" y="84" width="14" height="6" rx="2" fill="#202020"/>
    <rect x="-72" y="48" width="14" height="6" rx="2" fill="#202020"/>

    <!-- chain -->
    <g stroke="#303030" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7">
      <line x1="-80" y1="70" x2="-110" y2="70"/>
    </g>

    <!-- front basket? -> no, let's put a small fish basket hanging on handlebar -->
    <g transform="translate(68,-20)">
      <path d="M-10,0 q0,18 10,20 q10,-2 10,-20 z" fill="#8a6030" stroke="#5a3d1a" stroke-width="1.2"/>
      <path d="M-8,5 q8,3 16,0 M-9,10 q9,3 18,0" stroke="#5a3d1a" stroke-width="0.8" fill="none"/>
      <!-- little fish tail peeking out -->
      <path d="M-2,20 q-4,4 -6,10 M2,20 q4,4 6,10" stroke="#c0d8e0" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>

    <!-- rear fender -->
    <path d="M-160,75 a55,55 0 0 1 100,0" stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- front fender -->
    <path d="M40,75 a55,55 0 0 1 100,0" stroke="#2a2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- bell on handlebar -->
    <circle cx="44" cy="-34" r="4" fill="#d8a830"/>

    <!-- Shadow under bike -->
    <ellipse cx="-10" cy="130" rx="130" ry="8" fill="#000" opacity="0.18"/>
  </g>

  <!-- ============ PELICAN RIDING ============ -->
  <g transform="translate(380,350)">
    <!-- Shadow on seat -->
    <ellipse cx="-28" cy="78" rx="35" ry="6" fill="#000" opacity="0.15"/>

    <!-- Tail feathers (behind) -->
    <g transform="translate(-85,40)">
      <path d="M0,0 q-30,-5 -55,-15 q8,12 20,22 q-25,2 -45,-5 q18,15 40,20 q-18,10 -35,12 q22,8 45,5 q-8,12 -10,25 q25,-8 40,-25 q2,18 -4,35 q22,-15 28,-40 q12,14 18,32 q5,-25 -8,-45 q20,2 35,12 q-8,-22 -28,-30 z" fill="#2a2e36"/>
      <path d="M-10,5 q-20,-2 -40,-10" stroke="#505860" stroke-width="1" fill="none"/>
    </g>

    <!-- Body (belly toward us, sitting upright on seat) -->
    <g transform="translate(-35,10)">
      <!-- back/wings fold line shadow -->
      <path d="M-10,10 q0,35 5,65" stroke="#a8a298" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- main body oval -->
      <ellipse cx="0" cy="35" rx="38" ry="48" fill="url(#belly)" stroke="#888078" stroke-width="1.2"/>
      <!-- chest highlight -->
      <path d="M-8,15 q-5,20 0,45 q3,-5 5,-10 q0,-20 -5,-35z" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Wing (folded along right side) -->
    <g transform="translate(-5,15)">
      <path d="M-5,10 q25,5 35,30 q5,25 -12,45 q-25,20 -50,8 q-5,-3 -8,-8 q10,5 25,-2 q20,-10 22,-32 q0,-15 -12,-28 q-8,-8 0,-13z" fill="url(#wing)" stroke="#1a1e24" stroke-width="1"/>
      <!-- feather layers -->
      <path d="M25,40 q-5,12 -18,20 M20,55 q-8,10 -20,15 M12,68 q-10,8 -22,10" stroke="#1a1e24" stroke-width="0.8" fill="none" opacity="0.7"/>
    </g>
    <!-- left wing tip peeking -->
    <path d="M-70,35 q-10,15 -5,35 q8,10 15,5" fill="#5a6068" stroke="#2a2e36" stroke-width="0.8"/>

    <!-- Neck: curves up from body -->
    <path d="M-20,5 q-5,-30 10,-48 q12,-15 28,-10" fill="#f0ebe0" stroke="#888078" stroke-width="1.5"/>
    <path d="M-18,0 q-3,-22 10,-38" stroke="#d8d2c5" stroke-width="1.5" fill="none"/>

    <!-- Head -->
    <g transform="translate(28,-58)">
      <!-- crown tuft -->
      <path d="M-3,-3 q0,-10 5,-14 q5,8 10,-2 q3,-5 7,-2 q-2,8 -8,14 q-8,6 -14,4z" fill="#e8e2d4" stroke="#888078" stroke-width="0.8"/>
      <!-- head ellipse -->
      <ellipse cx="8" cy="3" rx="17" ry="14" fill="#f8f4ea" stroke="#888078" stroke-width="1.2"/>
      <!-- eye patch (yellow like a real pelican) -->
      <ellipse cx="5" cy="1" rx="9" ry="6" fill="#fff0c0" opacity="0.8"/>
      <!-- eye -->
      <circle cx="3" cy="1" r="3.2" fill="#fff"/>
      <circle cx="4" cy="1" r="2.2" fill="#202020"/>
      <circle cx="4.6" cy="0.3" r="0.7" fill="#fff"/>
      <!-- cheek line -->
      <path d="M-6,6 q-2,4 0,8" stroke="#c0b8a8" stroke-width="0.8" fill="none"/>

      <!-- Beak (LONG, sticking forward) -->
      <g transform="translate(15,-2) rotate(-5)">
        <!-- upper mandible -->
        <path d="M0,-3 q40,-2 70,2 q5,0 6,3 q-1,3 -3,3 L0,3 z" fill="url(#beak)" stroke="#8a3010" stroke-width="0.8"/>
        <!-- ridge highlight -->
        <path d="M2,-2 q35,-3 70,0" stroke="#ffd880" stroke-width="1" fill="none" opacity="0.7"/>
        <!-- lower mandible / pouch -->
        <path d="M0,3 q35,18 68,8 q4,-2 5,-6 q-32,5 -73,-5z" fill="url(#pouch)" stroke="#a03010" stroke-width="0.8"/>
        <!-- beak tip hook -->
        <path d="M73,-1 q3,2 2,6 q-1,1 -3,0 q-2,-3 -3,-5z" fill="#c04010"/>
        <!-- pouch wrinkle -->
        <path d="M15,8 q10,6 25,8 M35,12 q10,3 22,3" stroke="#a04018" stroke-width="0.6" fill="none" opacity="0.6"/>
      </g>
    </g>

    <!-- === Legs on pedals === -->
    <!-- upper leg (thigh) down to knee -->
    <g stroke="#f0d0a8" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M-45,60 q-5,15 -15,25"/>
      <path d="M-15,60 q5,12 12,22"/>
    </g>
    <!-- webbed feet on pedals -->
    <g fill="#f0a050" stroke="#c06020" stroke-width="1">
      <!-- left foot (back pedal up) -->
      <g transform="translate(-65,83) rotate(-30)">
        <path d="M-8,0 q2,-4 8,-4 q8,0 8,4 q0,4 -8,4 q-6,0 -8,-4z"/>
        <path d="M8,-4 q6,-1 10,2 M8,0 q7,0 10,3 M8,4 q5,1 9,0" stroke-width="1.2"/>
      </g>
      <!-- right foot (front pedal down) -->
      <g transform="translate(0,88) rotate(20)">
        <path d="M-8,0 q2,-4 8,-4 q8,0 8,4 q0,4 -8,4 q-6,0 -8,-4z"/>
        <path d="M8,-4 q6,-1 10,2 M8,0 q7,0 10,3 M8,4 q5,1 9,0" stroke-width="1.2"/>
      </g>
    </g>

    <!-- Wing-gripping handlebar -->
    <g stroke="#f0d0a8" stroke-width="5" stroke-linecap="round" fill="none">
      <!-- right arm reaching to handlebar right grip (at 62,-34 + bike offset) -->
      <path d="M5,10 q20,-15 45,-28"/>
      <!-- left arm reaching to left grip -->
      <path d="M-10,12 q-5,-20 15,-35"/>
    </g>
    <!-- wing tip "hands" wrapped around grips -->
    <ellipse cx="50" cy="-20" rx="5" ry="4" fill="#3a3e46"/>
    <ellipse cx="5" cy="-24" rx="5" ry="4" fill="#3a3e46"/>

    <!-- Little red scarf flowing back -->
    <path d="M-10,-20 q-20,-5 -45,8 q2,8 10,10 q18,-10 35,-10 q3,-4 0,-8z" fill="#d03030"/>
    <path d="M-20,-15 q-15,3 -30,12" stroke="#a02020" stroke-width="1" fill="none"/>

    <!-- helmet! a tiny white sailor cap -->
    <g transform="translate(32,-70)">
      <path d="M-14,2 q0,-8 12,-8 q12,0 14,8 z" fill="#ffffff" stroke="#888" stroke-width="0.8"/>
      <rect x="-18" y="2" width="36" height="3" fill="#ffffff" stroke="#888" stroke-width="0.8"/>
      <circle cx="10" cy="-1" r="3" fill="#2060a8"/>
    </g>
  </g>

  <!-- Small sparkles on water near pelican for atmosphere -->
  <use href="#spark" transform="translate(200,430) scale(0.5)"/>
  <use href="#spark" transform="translate(540,420) scale(0.4)"/>
  <use href="#spark" transform="translate(720,450) scale(0.5)"/>
  <use href="#spark" transform="translate(300,470) scale(0.35)"/>

  <!-- A tiny seashell on sand -->
  <g transform="translate(260,560)">
    <path d="M0,0 q-6,-8 -12,-2 q-2,5 0,8 q5,2 12,0 q2,-3 0,-6z" fill="#f0d8c0" stroke="#a07860" stroke-width="0.6"/>
    <path d="M-10,0 q5,-3 10,0 M-8,2 q4,-2 8,0" stroke="#a07860" stroke-width="0.4" fill="none"/>
  </g>

  <!-- Gentle animation hint: wheel spokes blurred? keep static for svg; add SMIL sun shimmer -->
  <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite" xlink:href="#sun"/>
</svg>
