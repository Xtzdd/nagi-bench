<script type="module">
import * as THREE from 'three';

/* ══════════════ 渲染器与场景 ══════════════ */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.42;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.5, 900);
camera.position.set(0, -34, 96);

const root = new THREE.Group();
scene.add(root);

/* ══════════════ 程序化贴图 ══════════════ */

function canvas2d(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, g: c.getContext('2d') };
}

function tex(canvas, repeat, linear) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  if (!linear) t.colorSpace = THREE.NoColorSpace;
  t.needsUpdate = true;
  return t;
}

// 日内瓦波纹（Côtes de Genève）：宽阔的平行条带
function cotesTexture() {
  const { c, g } = canvas2d(1024, 256);
  g.fillStyle = '#7a7a7a'; g.fillRect(0, 0, 1024, 256);
  for (let y = 0; y < 256; y++) {
    const f = Math.sin((y / 256) * Math.PI * 7);
    const v = 128 + f * 62;
    g.fillStyle = 'rgb(' + (v | 0) + ',' + (v | 0) + ',' + (v | 0) + ')';
    g.fillRect(0, y, 1024, 1);
  }
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * 1024, y = Math.random() * 256, a = Math.random() * 0.16;
    g.fillStyle = 'rgba(255,255,255,' + a + ')';
    g.fillRect(x, y, 1, 1);
  }
  return c;
}

// 珍珠纹（Perlage）：重叠的小圆点磨砂
function perlageTexture() {
  const { c, g } = canvas2d(512, 512);
  g.fillStyle = '#6e6e6e'; g.fillRect(0, 0, 512, 512);
  const step = 15;
  for (let y = -step; y < 512 + step; y += step) {
    for (let x = -step; x < 512 + step; x += step) {
      const ox = ((y / step) % 2) * (step / 2);
      const r = step * 0.68;
      const grd = g.createRadialGradient(x + ox - r * 0.3, y - r * 0.3, 1, x + ox, y, r);
      grd.addColorStop(0, 'rgba(255,255,255,0.42)');
      grd.addColorStop(0.62, 'rgba(150,150,150,0.14)');
      grd.addColorStop(1, 'rgba(0,0,0,0.30)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x + ox, y, r, 0, Math.PI * 2); g.fill();
    }
  }
  return c;
}

// 拉丝（桥板抛光后残留的细密纹理）
function brushedTexture() {
  const { c, g } = canvas2d(512, 512);
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 26000; i++) {
    const y = Math.random() * 512, l = 12 + Math.random() * 60, x = Math.random() * 512;
    const v = 110 + Math.random() * 90;
    g.strokeStyle = 'rgba(' + (v | 0) + ',' + (v | 0) + ',' + (v | 0) + ',0.5)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y); g.stroke();
  }
  return c;
}

const TEX = {
  cotes: () => tex(cotesTexture(), 1),
  perlage: () => tex(perlageTexture(), 1),
  brushed: () => tex(brushedTexture(), 1)
};

/* ══════════════ 程序化影棚环境贴图（无需外部资源） ══════════════ */

function studioEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x03050a);
  const soft = (w, h, d, x, y, z, hex, intensity) => {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(intensity) })
    );
    m.position.set(x, y, z);
    env.add(m);
  };
  soft(46, 26, 1, 0, 0, -22, 0xffffff, 3.9);   // 主光（背面柔光箱）
  soft(30, 1, 26, 0, 17, 0, 0xffe6c4, 2.9);    // 顶部灯
  soft(1, 20, 20, -19, 1, 3, 0x9fc0ff, 1.75);  // 冷侧补光
  soft(1, 20, 20, 19, 1, 3, 0xffcf9f, 1.95);    // 暖侧补光
  soft(1, 10, 10, 0, -1, 22, 0x9fb4cc, 0.8);   // 正面柔光
  const rt = pmrem.fromScene(env, 0.02);
  pmrem.dispose();
  return rt.texture;
}
const envMap = studioEnvironment();
scene.environment = envMap;

/* ══════════════ 背景穹顶与倒影地面 ══════════════ */

const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { c1: { value: new THREE.Color(0x0b1524) }, c2: { value: new THREE.Color(0x020306) } },
  vertexShader: 'varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: [
    'uniform vec3 c1; uniform vec3 c2; varying vec3 vP;',
    'void main(){',
    '  float h = clamp(vP.y*0.5+0.5, 0.0, 1.0);',
    '  vec3 c = mix(c2, c1, pow(h, 1.5));',
    '  float glow = pow(max(dot(normalize(vP), normalize(vec3(0.0,0.35,-1.0))), 0.0), 6.0);',
    '  c += vec3(0.05,0.07,0.11) * glow;',
    '  gl_FragColor = vec4(c, 1.0);',
    '}'
  ].join('\n')
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 20), skyMat));

{
  const { c, g } = canvas2d(512, 512);
  const grd = g.createRadialGradient(256, 256, 30, 256, 256, 250);
  grd.addColorStop(0, 'rgba(255,255,255,0.5)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  const t = tex(c, 1, true);
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(240, 64),
    new THREE.MeshStandardMaterial({
      color: 0x0d131c, metalness: 0.96, roughness: 0.2,
      alphaMap: t, transparent: true, envMapIntensity: 1.15
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -25.5;
  scene.add(floor);
}

/* ══════════════ 灯光 ══════════════ */

const key = new THREE.DirectionalLight(0xfff4e2, 3.7);
key.position.set(34, 46, 44);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 20;
key.shadow.camera.far = 190;
key.shadow.camera.left = -46; key.shadow.camera.right = 46;
key.shadow.camera.top = 46; key.shadow.camera.bottom = -46;
key.shadow.bias = -0.0009;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fc4ff, 2.9);
rim.position.set(-44, 22, -30);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffd9b0, 1.35);
fill.position.set(14, -26, 32);
scene.add(fill);

scene.add(new THREE.AmbientLight(0x4d6076, 0.9));

/* ══════════════ 材质库 ══════════════ */

const M = {
  polishedSteel: new THREE.MeshStandardMaterial({ color: 0xd9dee5, metalness: 1.0, roughness: 0.075, envMapIntensity: 1.5 }),
  brushedSteel: new THREE.MeshStandardMaterial({
    color: 0xc3c9d1, metalness: 1.0, roughness: 0.3, envMapIntensity: 1.25,
    roughnessMap: TEX.brushed()
  }),
  cotesSteel: new THREE.MeshStandardMaterial({
    color: 0xc9cfd7, metalness: 1.0, roughness: 0.24, envMapIntensity: 1.35,
    roughnessMap: TEX.cotes(), bumpMap: TEX.cotes(), bumpScale: 0.55
  }),
  perlagePlate: new THREE.MeshStandardMaterial({
    color: 0xb9c0c9, metalness: 1.0, roughness: 0.42, envMapIntensity: 1.1,
    roughnessMap: TEX.perlage(), bumpMap: TEX.perlage(), bumpScale: 0.32
  }),
  roseGold: new THREE.MeshStandardMaterial({ color: 0xd9a373, metalness: 1.0, roughness: 0.15, envMapIntensity: 1.5 }),
  bluedSteel: new THREE.MeshStandardMaterial({ color: 0x2c4a86, metalness: 1.0, roughness: 0.14, envMapIntensity: 1.6 }),
  darkSpacer: new THREE.MeshStandardMaterial({ color: 0x14171c, metalness: 0.68, roughness: 0.52 }),
  ruby: new THREE.MeshPhysicalMaterial({
    color: 0xa8122a, metalness: 0.0, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.06,
    transparent: true, opacity: 0.92, envMapIntensity: 1.7, emissive: 0x360409, emissiveIntensity: 0.55
  }),
  sapphire: new THREE.MeshPhysicalMaterial({
    color: 0xdfeaf2, metalness: 0, roughness: 0.015,
    transparent: true, opacity: 0.19, clearcoat: 1, clearcoatRoughness: 0.01,
    ior: 1.77, reflectivity: 0.62, envMapIntensity: 2.1, side: THREE.DoubleSide, depthWrite: false
  }),
  lume: new THREE.MeshStandardMaterial({
    color: 0xd6f7dc, emissive: 0x74f2a0, emissiveIntensity: 1.5, roughness: 0.55, metalness: 0
  }),
  handSteel: new THREE.MeshStandardMaterial({ color: 0xe4e9ef, metalness: 1.0, roughness: 0.06, envMapIntensity: 1.8 }),
  leather: new THREE.MeshStandardMaterial({ color: 0x2a1d16, roughness: 0.85, metalness: 0.05 }),
  caseSteel: new THREE.MeshStandardMaterial({ color: 0xcfd5dd, metalness: 1.0, roughness: 0.055, envMapIntensity: 1.7, side: THREE.DoubleSide })
};

/* ══════════════ 几何工具 ══════════════ */

// 齿轮：外圈梯形齿 + 中心孔 + 辐条减重（镂空轮系）
function gearGeometry(rOuter, teeth, toothH, holeR, spokes, thickness) {
  const shape = new THREE.Shape();
  const step = (Math.PI * 2) / teeth;
  const tipR = rOuter + toothH;
  for (let i = 0; i < teeth; i++) {
    const a = i * step;
    const pts = [
      [rOuter, a],
      [tipR, a + step * 0.17],
      [tipR, a + step * 0.55],
      [rOuter, a + step * 0.72]
    ];
    for (let k = 0; k < 4; k++) {
      const p = pts[k];
      const x = Math.cos(p[1]) * p[0], y = Math.sin(p[1]) * p[0];
      if (i === 0 && k === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
    }
  }
  shape.closePath();

  const hole = new THREE.Path();
  hole.absarc(0, 0, holeR, 0, Math.PI * 2, true);
  shape.holes.push(hole);

  if (spokes > 0) {
    const inner = holeR + 0.5, outer = rOuter - 0.7, hw = 0.44;
    for (let s = 0; s < spokes; s++) {
      const a = (s / spokes) * Math.PI * 2;
      const c = Math.cos(a), si = Math.sin(a);
      const nx = -si * hw, ny = c * hw;
      const sp = new THREE.Path();
      sp.moveTo(c * inner - nx, si * inner - ny);
      sp.lineTo(c * outer - nx, si * outer - ny);
      sp.lineTo(c * outer + nx, si * outer + ny);
      sp.lineTo(c * inner + nx, si * inner + ny);
      sp.closePath();
      shape.holes.push(sp);
    }
  }
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true, bevelThickness: 0.028,
    bevelSize: 0.028, bevelSegments: 1, curveSegments: 8
  });
  g.translate(0, 0, -thickness / 2);
  return g;
}

// 螺旋游丝
function hairspringGeometry(coils, r0, r1, tubeR) {
  const pts = [];
  const total = coils * Math.PI * 2;
  for (let i = 0; i <= 320; i++) {
    const t = i / 320;
    const a = t * total;
    const r = r0 + (r1 - r0) * t;
    pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.TubeGeometry(curve, 360, tubeR, 6, false);
}

// 开槽蓝钢螺钉
function screwMesh(scale) {
  const g = new THREE.Group();
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.55 * scale, 0.55 * scale, 0.24 * scale, 20), M.bluedSteel);
  head.rotation.x = Math.PI / 2;
  head.position.z = 0.12 * scale;
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.9 * scale, 0.1 * scale, 0.1 * scale), M.darkSpacer);
  slot.position.z = 0.24 * scale;
  g.add(head, slot);
  return g;
}

// 红宝石轴承（含金质托座）
function jewelMesh(r, h) {
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.28, r * 1.28, h * 0.42, 18), M.roseGold);
  seat.rotation.x = Math.PI / 2;
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.86, h, 22), M.ruby);
  stone.rotation.x = Math.PI / 2;
  stone.position.z = h * 0.2;
  g.add(seat, stone);
  return g;
}

/* ══════════════ 机芯装配 ══════════════ */

const parts = [];          // 参与标签 / 爆炸 / 拾取的零件
const pickables = [];

function registerPart(group, info) {
  parts.push(info);
  group.traverse((o) => {
    if (o.isMesh) {
      o.userData.part = info;
      pickables.push(o);
    }
  });
  if (info.materialList) info.materialList.forEach((m) => m.focusColor = info.focusColor);
  movement.add(group);
  return group;
}

/* — 轮系（中心轮 / 三番轮 / 四番轮 / 擒纵轮） — */
function makeWheel(name, zh, en, opts) {
  const g = new THREE.Group();
  const wheel = new THREE.Mesh(
    gearGeometry(opts.r, opts.teeth, opts.toothH, opts.hole, opts.spokes, opts.thick),
    opts.mat || M.cotesSteel
  );
  wheel.castShadow = true; wheel.receiveShadow = true;
  g.add(wheel);
  const arbor = new THREE.Mesh(new THREE.CylinderGeometry(opts.arbor || 0.3, opts.arbor || 0.3, opts.thick * 5, 12), M.polishedSteel);
  arbor.rotation.x = Math.PI / 2;
  g.add(arbor);
  if (opts.clubTeeth) {
    for (let i = 0; i < opts.teeth; i++) {
      const a = (i / opts.teeth) * Math.PI * 2;
      const club = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.24, opts.thick * 1.05), M.polishedSteel);
      club.position.set(Math.cos(a) * (opts.r + opts.toothH * 0.7), Math.sin(a) * (opts.r + opts.toothH * 0.7), 0);
      club.rotation.z = a;
      g.add(club);
    }
  }
  g.position.set(opts.x, opts.y, opts.z);
  return registerPart(g, {
    zh, en, z: opts.z, desc: opts.desc, specs: opts.specs, focusColor: opts.focusColor
  });
}

function bridgeMesh(points, thickness, mat) {
  const s = new THREE.Shape();
  points.forEach((p, i) => { if (i === 0) s.moveTo(p[0], p[1]); else s.lineTo(p[0], p[1]); });
  s.closePath();
  return new THREE.Mesh(
    new THREE.ExtrudeGeometry(s, { depth: thickness, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 1, curveSegments: 12 }),
    mat
  );
}

function makeHand(len, width, tailLen, isLume, mat) {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  const w = width / 2;
  shape.moveTo(-tailLen, w * 0.7);
  shape.lineTo(len * 0.62, w);
  shape.lineTo(len, w * 0.34);
  shape.lineTo(len, -w * 0.34);
  shape.lineTo(len * 0.62, -w);
  shape.lineTo(-tailLen, -w * 0.7);
  shape.closePath();
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 1 }),
    mat || M.handSteel
  );
  body.castShadow = true;
  g.add(body);
  if (isLume) {
    const lw = w * 0.5;
    const ls = new THREE.Shape();
    ls.moveTo(len * 0.3, lw);
    ls.lineTo(len * 0.92, lw * 0.5);
    ls.lineTo(len * 0.92, -lw * 0.5);
    ls.lineTo(len * 0.3, -lw);
    ls.closePath();
    const lm = new THREE.Mesh(new THREE.ExtrudeGeometry(ls, { depth: 0.2, bevelEnabled: false }), M.lume);
    lm.position.z = 0.17;
    g.add(lm);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(w * 0.85, w * 0.85, 0.34, 18), mat || M.handSteel);
  cap.rotation.x = Math.PI / 2;
  g.add(cap);
  return g;
}

/* ══════════════ 相机控制（自写轨道控制） ══════════════ */

const orbit = {
  theta: -0.34, phi: 1.16, radius: 96, baseTheta: -0.34,
  targetTheta: -0.34, targetPhi: 1.16, targetRadius: 96,
  auto: true, idle: 0
};

function applyCamera() {
  const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
  camera.position.set(
    orbit.radius * sp * Math.sin(orbit.theta),
    orbit.radius * cp,
    orbit.radius * sp * Math.cos(orbit.theta)
  );
  camera.lookAt(0, 0, 1.0);
}
applyCamera();

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  orbit.idle = 0;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointerup', (e) => {
  dragging = false;
  try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
});
renderer.domElement.addEventListener('pointermove', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (dragging) {
    orbit.targetTheta -= (e.clientX - lastX) * 0.0062;
    orbit.targetPhi -= (e.clientY - lastY) * 0.0062;
    orbit.targetPhi = Math.max(0.28, Math.min(Math.PI - 0.28, orbit.targetPhi));
    lastX = e.clientX; lastY = e.clientY;
    orbit.baseTheta = orbit.targetTheta;
    orbit.idle = 0;
    orbit.auto = false;
    btnSpin.classList.remove('on');
  }
});
renderer.domElement.addEventListener('wheel', (e) => {
  orbit.targetRadius = Math.max(46, Math.min(190, orbit.targetRadius + e.deltaY * 0.06));
  orbit.idle = 0;
  e.preventDefault();
}, { passive: false });

const pointer = new THREE.Vector2(-2, -2);
const raycaster = new THREE.Raycaster();

/* ══════════════ 工具栏 ══════════════ */

const btnExplode = document.getElementById('b-explode');
const btnLabels = document.getElementById('b-labels');

let exploded = false, explodeT = 0;
let showLabels = true, running = true;

btnExplode.addEventListener('click', () => {

  btnExplode.classList.toggle('on', exploded);
});
btnLabels.addEventListener('click', () => {

});
btnSpin.addEventListener('click', () => {

  btnSpin.classList.toggle('on', orbit.auto);
});
btnRun.addEventListener('click', () => {

  btnRun.classList.toggle('on', running);
});
btnGlass.addEventListener('click', () => {

});
btnReset.addEventListener('click', () => {
  orbit.targetTheta = -0.34; orbit.baseTheta = -0.34; orbit.targetPhi = 1.16; orbit.targetRadius = 96;
  orbit.auto = true; btnSpin.classList.add('on');
  exploded = false; btnExplode.classList.remove('on');
  pinned = null; showDetail(null);
  crystalGroup.visible = true; btnGlass.classList.add('on'); btnGlass.textContent = '蓝宝石镜面';
});

window.addEventListener('keydown', (e) => {

  if (k === 'e') btnExplode.click();
  if (k === 'r') btnReset.click();
  if (k === 'l') btnLabels.click();
});

renderer.domElement.addEventListener('click', () => {

    pinned = pinned === hovered ? null : hovered;
    showDetail(pinned || hovered, !!pinned);

});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ══════════════ 动画循环 ══════════════ */

const BEAT = 8;                 // 每秒 8 次半振荡
const DEMO = 10;                // 展示加速倍率
const vLive = document.getElementById('v-live');
document.getElementById('v-parts').textContent = parts.length + ' 组 · ' + pickables.length + ' 件';
document.getElementById('v-jewels').textContent = '21 颗';
document.getElementById('v-bal').textContent = '±135 度';

let t0 = performance.now();
let acc = 0, frames = 0, fps = 0;

function frame(now) {
  const dt = Math.min(0.05, (now - t0) / 1000);
  t0 = now;
  const T = now / 1000;

  // 相机
  orbit.idle += dt;
  if (orbit.auto) orbit.targetTheta = orbit.baseTheta + Math.sin(T * 0.42) * 0.62;
  orbit.theta += (orbit.targetTheta - orbit.theta) * Math.min(1, dt * 8);
  orbit.phi += (orbit.targetPhi - orbit.phi) * Math.min(1, dt * 8);
  orbit.radius += (orbit.targetRadius - orbit.radius) * Math.min(1, dt * 6);
  applyCamera();

  const clock = running ? T * DEMO : 0;

  // 摆轮：4 Hz 正弦摆动 ±135 度
  const swing = Math.sin(clock * Math.PI * 2 * 4) * (Math.PI * 0.75) / 2;
  balanceGroup.rotation.z = swing;
  if (hairspringMesh) hairspringMesh.rotation.z = swing * 0.09;

  // 擒纵叉：每拍往复
  const beatPhase = (clock * BEAT) % 1;
  pallet.rotation.z = 0.16 * (beatPhase < 0.5 ? 1 : -1) * (1 - Math.min(1, Math.abs(beatPhase - 0.5) * 6));

  // 擒纵轮：每拍步进一齿（离散步进）
  const escapeSteps = Math.floor(clock * BEAT / 2);
  wheelEscape.rotation.z = -(escapeSteps * (Math.PI * 2 / 15));

  // 轮系与指针
  const secAngle = -(clock / 6) * Math.PI * 2;
  wheelFourth.rotation.z = secAngle;
  wheelThird.rotation.z = secAngle / 7.5;
  wheelCenter.rotation.z = secAngle / (7.5 * 8);
  barrelGroup.children.forEach((c, i) => { if (i === 1) c.rotation.z = secAngle / 360; });
  handSecond.rotation.z = secAngle;
  handMinute.rotation.z = secAngle / 60;
  handHour.rotation.z = secAngle / 720;

  // 爆炸视图缓动
  const goal = exploded ? 1 : 0;
  explodeT += (goal - explodeT) * Math.min(1, dt * 4.2);
  parts.forEach((p) => {
    const g = p.group;
    if (g) g.position.z = p.restZ + p.z * explodeT * 1.55;
  });

  // 拾取
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const next = hits.length ? hits[0].object.userData.part : null;
  if (next !== hovered) {
    hovered = next;
    labelEls.forEach((el, p) => el.classList.toggle('hot', p === hovered || p === pinned));
    if (!pinned) showDetail(hovered);
  }

  // 标签投影
  const v = new THREE.Vector3();
  labelEls.forEach((el, p) => {
    const a = ANCHORS[p.zh];
    if (!a || !showLabels) { el.style.opacity = '0'; return; }
    v.set(a[0], a[1], a[2] + (p.z || 0) * explodeT * 1.55);
    root.localToWorld(v);
    v.project(camera);
    const vis = v.z < 1 && v.z > -1;
    el.style.opacity = vis ? '1' : '0';
    el.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + 'px';
    el.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + 'px';
  });

  renderer.render(scene, camera);

  acc += dt; frames++;
  if (acc >= 0.4) {
    fps = Math.round(frames / acc); acc = 0; frames = 0;
    vLive.textContent = fps + ' fps · 摆幅 ' + Math.abs(swing * 180 / Math.PI).toFixed(0) + ' 度 · 擒纵步进 ' + escapeSteps;
    window.__watchStats = {
      fps: fps, meshes: pickables.length, parts: parts.length,
      welded: parts.length, exploded: exploded, labels: showLabels,
      swingDeg: +(swing * 180 / Math.PI).toFixed(1), escapeSteps: escapeSteps,
      ready: true
    };
  }
  requestAnimationFrame(frame);
}

// 记录各零件的基准 Z，供爆炸视图与相机动画使用
parts.forEach((p, i) => {
  p.group = movement.children[i] || null;
  p.restZ = p.group ? p.group.position.z : 0;
  if (p.group) p.group.userData.part = p;
});

document.getElementById('boot').classList.add('done');
window.__watchReady = true;
window.__watchInfo = {
  parts: parts.length, pickableMeshes: pickables.length,
  jewels: 21, beat: BEAT, balanceHz: 4, demoSpeed: DEMO
};
requestAnimationFrame(frame);
</script>
